name: Experiment AVM2 queued goto guard (manual only)
on:
  workflow_dispatch:
    inputs:
      build_web:
        description: Build an isolated experimental dual-WASM candidate only after all test gates pass
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: flashnest-frame-order-engine
  cancel-in-progress: false
jobs:
  validate-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      CARGO_BUILD_JOBS: 2
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      RUFFLE_SOURCE_DIR: ${{ github.workspace }}/.frame-order-ruffle
      ENGINE_EVIDENCE_DIR: ${{ github.workspace }}/frame-order-engine-evidence
    steps:
      - name: Checkout experiment source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout exact official Ruffle source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ruffle-rs/ruffle
          ref: 89a7049965f3090e706265670df309a5128233ac
          path: .frame-order-ruffle
          persist-credentials: false
      - name: Install explicit Rust and checksum-pinned Java compiler runtime
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p "$ENGINE_EVIDENCE_DIR"
          rustup toolchain install 1.99.1 --profile minimal --component rust-src --target wasm32-unknown-unknown
          curl --fail --location --retry 2 --max-time 180 'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.13%2B9/OpenJDK21U-jre_x64_linux_hotspot_21.0.13_9.tar.gz' -o "$RUNNER_TEMP/frame-order-jre.tar.gz"
          echo "a535a1df9c6284d9618872984e026ae0352d1f7e9e0605425c0e6114f47351dd  $RUNNER_TEMP/frame-order-jre.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/frame-order-jre"
          tar -xzf "$RUNNER_TEMP/frame-order-jre.tar.gz" -C "$RUNNER_TEMP/frame-order-jre" --strip-components=1
          echo "$RUNNER_TEMP/frame-order-jre/bin" >> "$GITHUB_PATH"
          rustc -vV | tee "$ENGINE_EVIDENCE_DIR/rustc.txt"
          cargo --version | tee "$ENGINE_EVIDENCE_DIR/cargo.txt"
          "$RUNNER_TEMP/frame-order-jre/bin/java" -version 2>&1 | tee "$ENGINE_EVIDENCE_DIR/java.txt"
      - name: Verify and stage original-only integration tests
        timeout-minutes: 5
        run: |
          set -euo pipefail
          test "$(git -C "$RUFFLE_SOURCE_DIR" rev-parse HEAD)" = 89a7049965f3090e706265670df309a5128233ac
          test -z "$(git -C "$RUFFLE_SOURCE_DIR" status --porcelain)"
          python3 experiments/frame-order/validate_fixtures.py
          python3 experiments/frame-order/engine-patch/check_patch_bundle.py
          python3 experiments/frame-order/engine-patch/stage_original_tests.py "$RUFFLE_SOURCE_DIR"
          (cd "$RUFFLE_SOURCE_DIR" && cargo metadata --locked --no-deps --format-version 1) > "$ENGINE_EVIDENCE_DIR/cargo-metadata.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          metadata = json.loads((Path(os.environ['ENGINE_EVIDENCE_DIR']) / 'cargo-metadata.json').read_text())
          package = next(p for p in metadata['packages'] if p['name'] == 'tests')
          target = next(t for t in package['targets'] if t['name'] == 'flashnest_frame_order')
          assert target['kind'] == ['test'] and target['test'], target
          print('Verified auto-discovered original fixture integration target')
          PY
      - name: Compile baseline headless test targets
        timeout-minutes: 40
        run: |
          set -euo pipefail
          cd "$RUFFLE_SOURCE_DIR"
          cargo test --locked -p tests --test tests --test flashnest_frame_order --profile ci --no-run 2>&1 | tee "$ENGINE_EVIDENCE_DIR/baseline-compile.log"
      - name: Verify baseline original traces and unchanged upstream goldens
        timeout-minutes: 12
        env:
          FRAME_ORDER_ENGINE_PHASE: baseline
          FRAME_ORDER_TRACE_DIR: ${{ github.workspace }}/frame-order-engine-evidence/baseline/original
        run: |
          set -euo pipefail
          (cd "$RUFFLE_SOURCE_DIR" && cargo test --locked -p tests --test flashnest_frame_order --profile ci -- --nocapture --test-threads=1) 2>&1 | tee "$ENGINE_EVIDENCE_DIR/baseline-original.log"
          grep -Eq 'test result: ok\. 2 passed; 0 failed; 0 ignored;' "$ENGINE_EVIDENCE_DIR/baseline-original.log"
          python3 experiments/frame-order/engine-build/run_adjacent_tests.py "$RUFFLE_SOURCE_DIR" "$ENGINE_EVIDENCE_DIR" baseline
      - name: Apply only reviewed queued-goto guard
        timeout-minutes: 2
        run: |
          set -euo pipefail
          patch="$GITHUB_WORKSPACE/experiments/frame-order/engine-patch/queued-goto-guard.patch"
          git -C "$RUFFLE_SOURCE_DIR" apply --check "$patch"
          git -C "$RUFFLE_SOURCE_DIR" apply "$patch"
          git -C "$RUFFLE_SOURCE_DIR" diff --check
          test "$(git -C "$RUFFLE_SOURCE_DIR" diff --name-only HEAD)" = core/src/display_object/movie_clip.rs
          git -C "$RUFFLE_SOURCE_DIR" diff HEAD > "$ENGINE_EVIDENCE_DIR/applied-source.diff"
      - name: Compile patched headless test targets
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cd "$RUFFLE_SOURCE_DIR"
          cargo test --locked -p tests --test tests --test flashnest_frame_order --profile ci --no-run 2>&1 | tee "$ENGINE_EVIDENCE_DIR/patched-compile.log"
      - name: Verify experimental repair target and unchanged upstream goldens
        timeout-minutes: 12
        env:
          FRAME_ORDER_ENGINE_PHASE: patched
          FRAME_ORDER_TRACE_DIR: ${{ github.workspace }}/frame-order-engine-evidence/patched/original
        run: |
          set -euo pipefail
          (cd "$RUFFLE_SOURCE_DIR" && cargo test --locked -p tests --test flashnest_frame_order --profile ci -- --nocapture --test-threads=1) 2>&1 | tee "$ENGINE_EVIDENCE_DIR/patched-original.log"
          grep -Eq 'test result: ok\. 2 passed; 0 failed; 0 ignored;' "$ENGINE_EVIDENCE_DIR/patched-original.log"
          python3 experiments/frame-order/engine-build/run_adjacent_tests.py "$RUFFLE_SOURCE_DIR" "$ENGINE_EVIDENCE_DIR" patched
      - name: Install pinned Node for optional candidate build
        if: inputs.build_web
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Install optional web build tools
        if: inputs.build_web
        timeout-minutes: 20
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang-18 libclang-18-dev libssl-dev pkg-config
          cargo install --locked wasm-bindgen-cli --version 0.2.127
          curl --fail --location --retry 2 --max-time 180 https://github.com/WebAssembly/binaryen/releases/download/version_129/binaryen-version_129-x86_64-linux.tar.gz -o "$RUNNER_TEMP/frame-order-binaryen.tar.gz"
          echo "50b9fa62b9abea752da92ec57e0c555fee578760cd237c40107957715d2976ba  $RUNNER_TEMP/frame-order-binaryen.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/frame-order-binaryen"
          tar -xzf "$RUNNER_TEMP/frame-order-binaryen.tar.gz" -C "$RUNNER_TEMP/frame-order-binaryen" --strip-components=1
          echo "$RUNNER_TEMP/frame-order-binaryen/bin" >> "$GITHUB_PATH"
          dpkg-query -W clang-18 libclang-18-dev libssl-dev pkg-config > "$ENGINE_EVIDENCE_DIR/web-system-packages.txt"
      - name: Build isolated dual-WASM candidate (not promoted)
        if: inputs.build_web
        timeout-minutes: 60
        run: |
          set -euo pipefail
          bash experiments/frame-order/engine-build/build_web_candidate.sh "$RUFFLE_SOURCE_DIR" "$GITHUB_WORKSPACE/experiments/frame-order/engine-patch/queued-goto-guard.patch" "$GITHUB_WORKSPACE/frame-order-engine-candidate"
      - name: Retain source and test provenance even on failure
        if: always()
        run: |
          mkdir -p "$ENGINE_EVIDENCE_DIR/experiment"
          cp -R experiments/frame-order/engine-build "$ENGINE_EVIDENCE_DIR/experiment/"
          cp -R experiments/frame-order/engine-patch "$ENGINE_EVIDENCE_DIR/experiment/"
          cp experiments/frame-order/fixtures/manifest.json "$ENGINE_EVIDENCE_DIR/experiment/original-fixture-manifest.json"
          printf '%s\n' "repository=$GITHUB_REPOSITORY" "experimentCommit=$GITHUB_SHA" "runID=$GITHUB_RUN_ID" "runAttempt=$GITHUB_RUN_ATTEMPT" "imageOS=${ImageOS:-unknown}" "imageVersion=${ImageVersion:-unknown}" > "$ENGINE_EVIDENCE_DIR/run.txt"
          git -C "$RUFFLE_SOURCE_DIR" status --short > "$ENGINE_EVIDENCE_DIR/upstream-status.txt" || true
      - name: Upload experiment evidence and optional unpromoted candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FlashNest-experimental-frame-order-engine
          path: |
            frame-order-engine-evidence
            frame-order-engine-candidate
          retention-days: 7
          if-no-files-found: warn
