<!doctype html><meta charset="utf-8"><title>Mouse touch DOM validation</title><style>body{font:16px system-ui;background:#202936;color:white}#host{display:block;margin:30px;width:400px;height:240px}button{padding:12px}#cursor{position:fixed;width:12px;height:12px;background:#fff;pointer-events:none;clip-path:polygon(0 0,0 100%,100% 70%)}</style><h1>Mouse touch DOM validation</h1><button id="run">Run gesture checks</button><output id="result">Ready</output><div id="host" tabindex="0"></div><div id="cursor" hidden></div><script src="../App/Resources/Web/mouse-touch.js"></script><script>
const host=document.getElementById('host'),root=host.attachShadow({mode:'open'});root.innerHTML='<style>canvas{width:100%;height:100%;touch-action:none;background:#47617a}</style><canvas width="1200" height="720"></canvas>';const canvas=root.querySelector('canvas'),received=[];
for(const t of ['pointerdown','pointermove','pointerup'])canvas.addEventListener(t,e=>received.push({type:t,kind:e.pointerType,x:e.offsetX,y:e.offsetY,button:e.button,buttons:e.buttons}));
const controller=FlashNestMouseTouch.create({canvas,host,cursor:document.getElementById('cursor')});controller.initialize();
let n=0;function event(type,id,x,y){canvas.dispatchEvent(new PointerEvent(type,{pointerType:'touch',pointerId:id,clientX:x,clientY:y,bubbles:true,composed:true,cancelable:true}));}function check(ok,name){if(!ok)throw Error(name);n++;}
document.getElementById('run').onclick=()=>{try{received.length=0;n=0;event('pointerdown',1,100,100);event('pointerup',1,100,100);check(received.length===2&&received[0].kind==='touch','default-off');received.length=0;controller.setEnabled(true);event('pointerdown',1,100,100);event('pointerup',1,100,100);check(received.every(e=>e.kind==='mouse'),'no duplicate touch');check(received.filter(e=>e.type==='pointerdown').length===1,'one click');let move=received.find(e=>e.type==='pointermove');check(Math.abs(move.x-199.5)<1&&Math.abs(move.y-119.5)<1,'shadow CSS position not DPR pixels');received.length=0;event('pointerdown',1,100,100);event('pointermove',1,-1000,-1000);event('pointerup',1,-1000,-1000);check(!received.some(e=>e.type==='pointerdown'),'drag no click');move=received.filter(e=>e.type==='pointermove').at(-1);check(move.x===0&&move.y===0&&move.buttons===0,'top-left no held button');received.length=0;event('pointerdown',1,100,100);event('pointerdown',2,130,100);event('pointerup',1,100,100);event('pointerup',2,130,100);check(received.filter(e=>e.type==='pointerdown').length===1&&received.find(e=>e.type==='pointerdown').button===2,'two fingers right only');received.length=0;event('pointerdown',1,100,100);controller.setEnabled(false);event('pointerup',1,100,100);check(!received.some(e=>e.type==='pointerup'),'modeoff eats old release');controller.setEnabled(true);document.getElementById('result').textContent=`PASS: ${n} browser DOM checks; real Shadow DOM, offsetX/Y, default-off, drag, right click, cancellation. Not iOS certification.`;}catch(e){document.getElementById('result').textContent='FAIL: '+e.message;console.error(e);}};
</script>
