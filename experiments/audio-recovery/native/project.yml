name: AudioRecoveryDiagnostic
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    exactVersion: 0.9.20
targets:
  AudioRecoveryDiagnostic:
    type: application
    platform: iOS
    sources:
      - path: Host
      - path: staged/App
        excludes: [FlashNestApp.swift, Resources, Info-Debug.plist]
      - path: staged/App/Resources
        excludes: [Web]
        buildPhase: resources
      - path: staged/App/Resources/Web
        type: folder
        buildPhase: resources
      - path: staged/lifecycle
        type: folder
        buildPhase: resources
      - path: staged/audio-recovery-injection.js
        buildPhase: resources
      - path: staged/startup-journal.js
        buildPhase: resources
      - path: staged/startup-resources.json
        buildPhase: resources
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flashnest.audio-recovery.diagnostic
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: staged/Info.plist
      properties:
        CFBundleDisplayName: Audio Recovery Diagnostic
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
  AudioRecoveryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: AudioRecoveryDiagnostic
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.flashnest.audio-recovery.tests
schemes:
  AudioRecoveryDiagnostic:
    build:
      targets:
        AudioRecoveryDiagnostic: all
        AudioRecoveryUITests: [test]
    test:
      targets: [AudioRecoveryUITests]
