name: Build FlashNest diagnostic v2 import-warning test IPA build23
on:
  push:
    branches: [experiment/longrun-diagnostic-build23]
    paths:
      - 'experiments/longrun-ipa-156-build23/**'
      - '.github/workflows/build-longrun-diagnostic-build23.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: flashnest-longrun-diagnostic-build23
  cancel-in-progress: false
jobs:
  package:
    runs-on: macos-14
    timeout-minutes: 65
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
      DIAGNOSTIC_RECIPE: recipe/experiments/longrun-ipa-156-build23
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: recipe
          persist-credentials: false
      - name: Validate reviewed diagnostic-only recipe and SDK
        run: |
          set -euo pipefail
          python3 "$DIAGNOSTIC_RECIPE/package.py" preflight
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          test "$(xcodebuild -version | head -1)" = 'Xcode 16.2'
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = '18.2'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 9bc000e37695696f2427b25fe08efe4993bf22e5
          path: source-checkout
          persist-credentials: false
      - name: Recover exact release baseline then apply reviewed diagnostic overlay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 "$DIAGNOSTIC_RECIPE/package.py" stage --source-checkout source-checkout --recipe-checkout recipe --output diagnostic-package
      - name: Run local diagnostic contracts and JavaScript controls
        env:
          DIAGNOSTIC_APP: diagnostic-package/app
          PHASE_APP: diagnostic-package/app
          LONG_RUN_MODULE: ${{ github.workspace }}/diagnostic-package/app/App/Resources/Web/long-run-diagnostics.js
        run: |
          set -euo pipefail
          node --check diagnostic-package/app/App/Resources/Web/long-run-diagnostics.js
          node "$DIAGNOSTIC_RECIPE/checks/test_long_run.js"
          python3 "$DIAGNOSTIC_RECIPE/checks/test_contract.py"
          python3 "$DIAGNOSTIC_RECIPE/checks/test_package.py"
          node recipe/experiments/device-phase-diagnostic-ipa-156-build20/checks/test_phase.js
      - name: Generate Xcode project using authenticated tool and locked dependency
        working-directory: diagnostic-package/app
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 120 https://github.com/yonaskolb/XcodeGen/releases/download/2.42.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          echo 'a760b4bf97460341316a2c00d8c87b2946c6c2729eb57e9a72abb3ef7bc0ef82  '"$RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen-experimental"
          "$RUNNER_TEMP/xcodegen-experimental/xcodegen/bin/xcodegen" generate
          mkdir -p FlashNest.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Package.resolved FlashNest.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          xcodebuild -resolvePackageDependencies -project FlashNest.xcodeproj -scheme FlashNest -disableAutomaticPackageResolution
      - name: Focused actual native import and diagnostics tests; not full-game acceptance
        env:
          RECIPE_CHECKOUT: ${{ github.workspace }}/recipe
        run: python3 "$DIAGNOSTIC_RECIPE/run_focused_tests.py" diagnostic-package/app diagnostic-package/focused-tests
      - name: Build unsigned Release diagnostic device App
        working-directory: diagnostic-package/app
        run: |
          set -euo pipefail
          xcodebuild -project FlashNest.xcodeproj -scheme FlashNest -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build -disableAutomaticPackageResolution CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package and verify unsigned diagnostic IPA
        env:
          RECIPE_CHECKOUT: ${{ github.workspace }}/recipe
        run: |
          set -euo pipefail
          mkdir diagnostic-package/artifacts
          bash diagnostic-package/app/scripts/package_unsigned.sh diagnostic-package/app/build/Build/Products/Release-iphoneos/FlashNest.app diagnostic-package/artifacts/FlashNest-1.5.6-build23-diagnostic-v2-import-warning-unsigned.ipa
          python3 "$DIAGNOSTIC_RECIPE/package.py" verify --ipa diagnostic-package/artifacts/FlashNest-1.5.6-build23-diagnostic-v2-import-warning-unsigned.ipa --app diagnostic-package/app --output diagnostic-package --record diagnostic-package/artifacts/diagnostic-provenance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FlashNest-1.5.6-build23-diagnostic-v2-import-warning-unsigned
          path: diagnostic-package/artifacts/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: FlashNest-build23-diagnostic-v2-import-warning-test-evidence
          path: |
            diagnostic-package/staging.json
            diagnostic-package/focused-tests/focused.log
            diagnostic-package/focused-tests/summary.json
            diagnostic-package/focused-tests/verification.json
            diagnostic-package/focused-tests/fixture-source-build.log
            diagnostic-package/focused-tests/ui.log
            diagnostic-package/focused-tests/ui-summary.json
            diagnostic-package/focused-tests/ui-verification.json
          if-no-files-found: warn
          retention-days: 7
