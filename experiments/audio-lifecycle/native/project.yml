name: NativeAudioLifecycle
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  NativeAudioLifecycle:
    type: application
    platform: iOS
    sources:
      - path: Host
        excludes: [Info.plist]
      - ../../../App/Server/LoopbackServer.swift
      - ../../../App/Server/HTTPProtocol.swift
      - ../../../audio-native-stage/NativeAudioIdentity.swift
      - path: ../../../audio-native-stage/Web
        type: folder
        buildPhase: resources
    info:
      path: ../../../audio-native-stage/Info.plist
      properties:
        CFBundleDisplayName: Audio Lifecycle Diagnostic
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flashnest.audio-lifecycle.diagnostic
        GENERATE_INFOPLIST_FILE: NO
  NativeAudioLifecycleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flashnest.audio-lifecycle.diagnostic.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: NativeAudioLifecycle
    dependencies:
      - target: NativeAudioLifecycle
schemes:
  NativeAudioLifecycle:
    build:
      targets:
        NativeAudioLifecycle: all
        NativeAudioLifecycleUITests: [test]
    test:
      targets: [NativeAudioLifecycleUITests]
