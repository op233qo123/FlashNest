name: FlashNest
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
targets:
  FlashNest:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Resources
          - Info.plist
          - Info-Debug.plist
      - path: App/Resources/Web
        type: folder
        buildPhase: resources
      - path: App/Resources/Assets.xcassets
        buildPhase: resources
      - path: App/Resources/Localization
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: FlashNest
        CFBundleShortVersionString: '1.5.3'
        CFBundleVersion: '12'
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
        UIApplicationSupportsIndirectInputEvents: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flashnest.app
        MARKETING_VERSION: '1.5.3'
        CURRENT_PROJECT_VERSION: '12'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          INFOPLIST_FILE: App/Info-Debug.plist
    dependencies:
      - package: ZIPFoundation
  FlashNestTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - path: fixtures
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flashnest.app.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FlashNest
      - package: ZIPFoundation
  FlashNestUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flashnest.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FlashNest
    dependencies:
      - target: FlashNest
  FlashNestFixtureSource:
    type: application
    platform: iOS
    sources:
      - path: UITestSupport/FixtureSource
        excludes:
          - Info.plist
      - path: fixtures/multi-swf
        type: folder
        buildPhase: resources
      - path: fixtures/lifecycle
        type: folder
        buildPhase: resources
    info:
      path: UITestSupport/FixtureSource/Info.plist
      properties:
        CFBundleDisplayName: FlashNest Source
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flashnest.fixture-source
        GENERATE_INFOPLIST_FILE: NO
schemes:
  FlashNest:
    build:
      targets:
        FlashNest: all
        FlashNestTests: [test]
    test:
      targets:
        - FlashNestTests
      gatherCoverageData: true
    archive:
      config: Release
  FlashNestUI:
    build:
      targets:
        FlashNest: all
        FlashNestUITests: [test]
    test:
      targets:
        - FlashNestUITests
  FlashNestFixtureSource:
    build:
      targets:
        FlashNestFixtureSource: all
