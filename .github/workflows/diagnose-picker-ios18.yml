name: Diagnose real folder picker on iOS 18.2 (manual only)
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Test scope
        type: choice
        options:
          - all
          - lifecycle
          - toolbar-diagnostics
          - home-import
          - home
          - fullscreen
          - external-import
        default: all
permissions:
  contents: read
concurrency:
  group: flashnest-picker-ios18
  cancel-in-progress: false
jobs:
  picker:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
      TEST_SCOPE: ${{ inputs.scope || 'all' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare pinned resources and project
        run: |
          set -euo pipefail
          python3 scripts/fetch_runtime.py
          python3 scripts/test_static.py
          python3 scripts/test_localization.py
          python3 scripts/test_licenses.py
          curl --fail --location --retry 2 --max-time 120 -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.42.0/xcodegen.zip
          echo "a760b4bf97460341316a2c00d8c87b2946c6c2729eb57e9a72abb3ef7bc0ef82  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen-pinned"
          "$RUNNER_TEMP/xcodegen-pinned/xcodegen/bin/xcodegen" generate
          mkdir -p FlashNest.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Package.resolved FlashNest.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          xcodebuild -version
          xcodebuild -resolvePackageDependencies -project FlashNest.xcodeproj -scheme FlashNestUI -disableAutomaticPackageResolution
      - name: Require installed iOS 18.2 simulator without downloading or substituting
        id: simulator
        run: |
          set -euo pipefail
          xcrun simctl list runtimes
          device_id=$(xcrun simctl list devices available --json | python3 scripts/select_simulator.py 18.2)
          echo "device_id=$device_id" >> "$GITHUB_OUTPUT"
          echo "Selected existing iOS 18.2 device $device_id"
      - name: Install separate source application for cross-container selection
        id: source_app
        run: |
          set -euo pipefail
          device_id='${{ steps.simulator.outputs.device_id }}'
          xcrun simctl bootstatus "$device_id" -b
          xcodebuild -project FlashNest.xcodeproj -scheme FlashNestFixtureSource -configuration Debug -sdk iphonesimulator -destination "platform=iOS Simulator,id=$device_id" -derivedDataPath build-source -disableAutomaticPackageResolution CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          xcrun simctl install "$device_id" build-source/Build/Products/Debug-iphonesimulator/FlashNestFixtureSource.app
      - name: Verify input recovery and save safety on iOS 18.2
        if: ${{ inputs.scope != 'lifecycle' && inputs.scope != 'toolbar-diagnostics' && inputs.scope != 'home-import' && inputs.scope != 'home' && inputs.scope != 'fullscreen' }}
        timeout-minutes: 10
        run: |
          set -o pipefail
          touch "$RUNNER_TEMP/flashnest-wk-tests-start"
          native_selection=(-only-testing:FlashNestTests/InputFocusRuntimeTests -only-testing:FlashNestTests/SaveManagementEntryPolicyTests -only-testing:FlashNestTests/SharedObjectPersistenceTests -only-testing:FlashNestTests/LastSessionDiagnosticsTests)
          if [ "$TEST_SCOPE" = "external-import" ]; then native_selection=(-only-testing:FlashNestTests/ArchivedSaveDeletionTests -only-testing:FlashNestTests/SaveImportReaderTests -only-testing:FlashNestTests/RawSOLImportTests -only-testing:FlashNestTests/RawSOLWebKitTests -only-testing:FlashNestTests/ExternalImportInboxTests -only-testing:FlashNestTests/ExternalImportCopyTests -only-testing:FlashNestTests/ImportFlowTests -only-testing:FlashNestTests/PackageImporterTests); fi
          xcodebuild test -project FlashNest.xcodeproj -scheme FlashNest -configuration Debug -sdk iphonesimulator -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}' -destination-timeout 120 -derivedDataPath build-picker -resultBundlePath SaveInputTests.xcresult -disableAutomaticPackageResolution -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 120 "${native_selection[@]}" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tee save-input-test.log
      - name: Tap the real Files Open and Cancel controls
        # Collect independent UI evidence even if a native diagnostic test fails.
        # The failed native step still makes the overall workflow fail.
        if: ${{ !cancelled() && steps.source_app.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          set -o pipefail
          selection=()
          if [ "$TEST_SCOPE" = "lifecycle" ]; then selection=(-only-testing:FlashNestUITests/LifecyclePlayerUITests); fi
          if [ "$TEST_SCOPE" = "toolbar-diagnostics" ]; then selection=(-only-testing:FlashNestUITests/LibraryToolbarDiagnosticsUITests); fi
          if [ "$TEST_SCOPE" = "home-import" ]; then selection=(-only-testing:FlashNestUITests/FolderPickerUITests -only-testing:FlashNestUITests/LibraryHomeUITests); fi
          if [ "$TEST_SCOPE" = "home" ]; then selection=(-only-testing:FlashNestUITests/LibraryHomeUITests); fi
          if [ "$TEST_SCOPE" = "fullscreen" ]; then selection=(-only-testing:FlashNestUITests/FullscreenPlayerUITests); fi
          if [ "$TEST_SCOPE" = "external-import" ]; then selection=(-only-testing:FlashNestUITests/ExternalDocumentImportUITests); fi
          echo "UI validation scope: $TEST_SCOPE"
          xcodebuild test -project FlashNest.xcodeproj -scheme FlashNestUI -configuration Debug -sdk iphonesimulator -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}' -destination-timeout 120 -derivedDataPath build-picker -resultBundlePath PickerTests.xcresult -disableAutomaticPackageResolution -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 480 "${selection[@]}" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tee picker-test.log
      - name: Export compact UI evidence
        if: always()
        run: |
          mkdir -p picker-evidence
          python3 scripts/collect_test_webkit_crashes.py "$RUNNER_TEMP/flashnest-wk-tests-start" picker-evidence/webkit-crashes
          xcrun xcresulttool help export attachments > picker-evidence/export-help.txt 2>&1 || true
          if [ -d SaveInputTests.xcresult ]; then
            xcrun xcresulttool export attachments --path SaveInputTests.xcresult --output-path picker-evidence/save-input-attachments
            xcrun xcresulttool get test-results summary --path SaveInputTests.xcresult > picker-evidence/save-input-summary.json
          fi
          if [ -d PickerTests.xcresult ]; then
            xcrun xcresulttool export attachments --path PickerTests.xcresult --output-path picker-evidence/attachments
            xcrun xcresulttool get test-results summary --path PickerTests.xcresult > picker-evidence/summary.json
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: FlashNest-iOS18.2-picker-evidence
          path: |
            picker-test.log
            save-input-test.log
            picker-evidence
          if-no-files-found: warn
          retention-days: 7
