name: FlashNest image memory focused WebGL retry (exact engine reuse)
on:
  push:
    branches: [experiment/image-memory-webgl-20261031]
    paths:
      - 'experiments/image-memory-webgl/**'
      - '.github/workflows/flashnest-image-memory-webgl.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: flashnest-image-memory-webgl
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      PREP: experiments/image-memory-webgl
      OLD: experiments/lazy-graphic-engine
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify public-only experiment contract before build
        run: python3 "$PREP/scripts/check_experiment.py"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Require sandboxed official Chrome before expensive compilation
        run: |
          set -euo pipefail
          python3 -m venv browser-venv
          browser-venv/bin/pip install --require-virtualenv -r "$OLD/browser/requirements.txt"
          mkdir -p "$PREP/evidence"
          browser-venv/bin/python "$PREP/scripts/browser_preflight.py"
      - name: Reuse exact successfully built engine pair without recompilation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/op233qo123/FlashNest/actions/artifacts/13028170023 > "$RUNNER_TEMP/image-memory-artifact.json"
          gh api repos/op233qo123/FlashNest/actions/artifacts/13028170023/zip > "$RUNNER_TEMP/image-memory-engines.zip"
          python3 "$PREP/scripts/stage_reuse.py" "$RUNNER_TEMP/image-memory-engines.zip" "$RUNNER_TEMP/image-memory-artifact.json" image-memory-engines
      - name: Run bounded synthetic WebGL comparison
        timeout-minutes: 20
        run: |
          set -euo pipefail
          browser-venv/bin/python "$PREP/browser/test_static.py"
          node "$PREP/browser/test_page.cjs"
          python3 "$PREP/scripts/prepare_browser.py" image-memory-engines image-memory-browser-contract.json --reuse
          browser-venv/bin/python "$PREP/browser/run.py" --contract image-memory-browser-contract.json --baseline image-memory-engines/baseline/runtime --candidate image-memory-engines/candidate/runtime --fixtures "$PREP/fixtures" --out image-memory-browser-evidence
      - name: Bound experimental outputs
        id: budget
        if: always()
        run: |
          set -euo pipefail
          mkdir -p image-memory-upload
          cp "$PREP/reuse-lock.json" image-memory-upload/
          if test -d image-memory-browser-evidence; then cp -R image-memory-browser-evidence image-memory-upload/; fi
          if test -d "$PREP/evidence"; then cp -R "$PREP/evidence" image-memory-upload/preflight; fi
          if test -f image-memory-browser-contract.json; then cp image-memory-browser-contract.json image-memory-upload/; fi
          if test -d toolchain-evidence; then cp -R toolchain-evidence image-memory-upload/; fi
          python3 "$OLD/scripts/evidence_budget.py" image-memory-upload --max-bytes 268435456
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.budget.outputs.allowed == 'true'
        with:
          name: FlashNest-image-memory-WebGL-reuse-not-IPA
          path: image-memory-upload
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
