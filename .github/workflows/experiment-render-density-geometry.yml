name: Experiment render-density geometry (locked candidate)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: flashnest-render-density-geometry
  cancel-in-progress: false
jobs:
  geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      REUSE: ${{ github.workspace }}/density-reused-build
      EVIDENCE: ${{ github.workspace }}/density-geometry-evidence
    steps:
      - name: Checkout corrected original harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Retrieve only the locked existing build and its API attestation
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = op233qo123/FlashNest
          mkdir -p "$EVIDENCE/build-api"
          gh api /repos/op233qo123/FlashNest/actions/runs/40514553456 > "$EVIDENCE/build-api/run.json"
          gh api '/repos/op233qo123/FlashNest/actions/runs/40514553456/jobs?filter=latest&per_page=100' > "$EVIDENCE/build-api/jobs.json"
          gh api /repos/op233qo123/FlashNest/actions/artifacts/12738984800 > "$EVIDENCE/build-api/artifact.json"
          gh api /repos/op233qo123/FlashNest/actions/artifacts/12738984800/zip > "$RUNNER_TEMP/locked-density-build.zip"
          python3 experiments/render-density/geometry-reuse/verify_artifact.py "$RUNNER_TEMP/locked-density-build.zip" "$REUSE" --metadata "$EVIDENCE/build-api" > "$EVIDENCE/reuse-verification.json"
      - name: Checkout pinned dependency tree for the existing WebDriver lock
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ruffle-rs/ruffle
          ref: 89a7049965f3090e706265670df309a5128233ac
          path: .geometry-dependencies
          persist-credentials: false
      - name: Install pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Validate corrected fixture and install locked WebDriver dependencies
        id: ready
        timeout-minutes: 10
        run: |
          set -euo pipefail
          test "$(git -C .geometry-dependencies rev-parse HEAD)" = 89a7049965f3090e706265670df309a5128233ac
          cmp .geometry-dependencies/web/package-lock.json "$REUSE/render-density-engine-candidate/source-correspondence/upstream/web/package-lock.json"
          cmp .geometry-dependencies/web/package.json "$REUSE/render-density-engine-candidate/source-correspondence/upstream/web/package.json"
          (cd .geometry-dependencies/web && npm ci --ignore-scripts)
          python3 experiments/render-density/scripts/test_fixture.py
          python3 experiments/render-density/geometry-reuse/test_verifier.py
          node experiments/render-density/browser-tests/test_helpers.mjs
          node experiments/render-density/browser-tests/test_page.mjs
          node --check experiments/render-density/browser-tests/run.mjs
          chrome=$(command -v google-chrome || command -v chromium)
          driver=$(command -v chromedriver || { test -n "${CHROMEWEBDRIVER:-}" && test -x "$CHROMEWEBDRIVER/chromedriver" && printf "%s" "$CHROMEWEBDRIVER/chromedriver"; })
          "$chrome" --version | tee "$EVIDENCE/chrome-version.txt"
          "$driver" --version | tee "$EVIDENCE/chromedriver-version.txt"
      - name: Full corrected geometry - WebGL
        timeout-minutes: 65
        run: |
          set -euo pipefail
          chrome=$(command -v google-chrome || command -v chromium)
          driver=$(command -v chromedriver || { test -n "${CHROMEWEBDRIVER:-}" && test -x "$CHROMEWEBDRIVER/chromedriver" && printf "%s" "$CHROMEWEBDRIVER/chromedriver"; })
          node experiments/render-density/browser-tests/run.mjs \
            --baseline "$REUSE/render-density-guard-baseline/runtime" \
            --candidate "$REUSE/render-density-engine-candidate/runtime" \
            --baseline-manifest "$REUSE/render-density-guard-baseline/runtime.browser-manifest.json" \
            --candidate-manifest "$REUSE/render-density-engine-candidate/runtime.browser-manifest.json" \
            --webdriverio "$GITHUB_WORKSPACE/.geometry-dependencies/web/node_modules/webdriverio" \
            --chrome "$chrome" --driver "$driver" --backend webgl --output "$EVIDENCE/browser-webgl"
      - name: Full corrected geometry - WGPU WebGL
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        timeout-minutes: 65
        run: |
          set -euo pipefail
          chrome=$(command -v google-chrome || command -v chromium)
          driver=$(command -v chromedriver || { test -n "${CHROMEWEBDRIVER:-}" && test -x "$CHROMEWEBDRIVER/chromedriver" && printf "%s" "$CHROMEWEBDRIVER/chromedriver"; })
          node experiments/render-density/browser-tests/run.mjs \
            --baseline "$REUSE/render-density-guard-baseline/runtime" \
            --candidate "$REUSE/render-density-engine-candidate/runtime" \
            --baseline-manifest "$REUSE/render-density-guard-baseline/runtime.browser-manifest.json" \
            --candidate-manifest "$REUSE/render-density-engine-candidate/runtime.browser-manifest.json" \
            --webdriverio "$GITHUB_WORKSPACE/.geometry-dependencies/web/node_modules/webdriverio" \
            --chrome "$chrome" --driver "$driver" --backend wgpu-webgl --output "$EVIDENCE/browser-wgpu-webgl"
      - name: Preserve distinct build and corrected harness provenance
        if: always()
        run: |
          mkdir -p "$EVIDENCE/current-experiment"
          cp -R experiments/render-density "$EVIDENCE/current-experiment/render-density"
          cp .github/workflows/experiment-render-density-geometry.yml "$EVIDENCE/current-experiment/"
          printf '%s\n' "repository=$GITHUB_REPOSITORY" "harnessCommit=$GITHUB_SHA" "geometryRun=$GITHUB_RUN_ID" "runtimeBuildCommit=a744b8b75ae9eacec28332b0ccf87822ddaae265" "runtimeBuildRun=40514553456" "runtimeArtifact=12738984800" > "$EVIDENCE/run.txt"
      - name: Retain corrected geometry evidence and unchanged source correspondence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FlashNest-render-density-corrected-geometry
          path: |
            density-geometry-evidence
            density-reused-build
          retention-days: 7
          if-no-files-found: warn
