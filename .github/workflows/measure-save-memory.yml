name: Measure native save memory A/B (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flashnest-native-save-memory
  cancel-in-progress: false
jobs:
  compare:
    runs-on: macos-14
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate harness and stage isolated baseline-derived trees
        id: stage
        run: |
          set -euo pipefail
          python3 -m unittest discover -s experiments/save-memory -p 'test_*.py'
          mkdir -p save-memory-evidence
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          xcodebuild -version | tee save-memory-evidence/xcode.txt
          sw_vers > save-memory-evidence/host.txt
          printf '%s\n' "repository=$GITHUB_REPOSITORY" "harnessCommit=$GITHUB_SHA" "runID=$GITHUB_RUN_ID" "runAttempt=$GITHUB_RUN_ATTEMPT" "imageOS=${ImageOS:-unknown}" "imageVersion=${ImageVersion:-unknown}" >> save-memory-evidence/host.txt
          git worktree add --detach "$RUNNER_TEMP/save-memory-baseline" a09ccefc4513b617a88898a3d1e4dfb6eaea91f9
          git worktree add --detach "$RUNNER_TEMP/save-memory-patched" a09ccefc4513b617a88898a3d1e4dfb6eaea91f9
          python3 experiments/save-memory/benchmark.py stage "$GITHUB_WORKSPACE" "$RUNNER_TEMP/save-memory-baseline" "$RUNNER_TEMP/save-memory-patched" save-memory-evidence/provenance.json
          git -C "$RUNNER_TEMP/save-memory-patched" diff -- App/Models/SaveStore.swift > save-memory-evidence/only-production-change.diff
          cp Tests/SaveStoreMemoryTests.swift save-memory-evidence/
          curl --fail --location --retry 2 --max-time 120 -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.42.0/xcodegen.zip
          echo "a760b4bf97460341316a2c00d8c87b2946c6c2729eb57e9a72abb3ef7bc0ef82  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen-pinned"
          xcrun simctl list devices available --json > save-memory-evidence/simulators.json
          device_id=$(python3 scripts/select_simulator.py 18.2 < save-memory-evidence/simulators.json)
          echo "device_id=$device_id" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$device_id" > save-memory-evidence/selected-device.txt
      - name: Measure pinned baseline (exactly two tests, five metric iterations)
        if: steps.stage.outcome == 'success'
        timeout-minutes: 15
        env:
          MEMORY_VARIANT: baseline
          MEMORY_DEVICE_ID: ${{ steps.stage.outputs.device_id }}
        run: bash experiments/save-memory/run_variant.sh
      - name: Measure isolated SaveStore patch on the same simulator
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        timeout-minutes: 15
        env:
          MEMORY_VARIANT: patched
          MEMORY_DEVICE_ID: ${{ steps.stage.outputs.device_id }}
        run: bash experiments/save-memory/run_variant.sh
      - name: Verify comparable evidence and report raw median differences
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 experiments/save-memory/benchmark.py compare save-memory-evidence/baseline/metrics.json save-memory-evidence/patched/metrics.json save-memory-evidence/comparison.json
          cat save-memory-evidence/comparison.json >> "$GITHUB_STEP_SUMMARY"
      - name: Retain complete native measurements, never an IPA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FlashNest-native-save-memory-AB
          path: |
            save-memory-evidence
            experiments/save-memory
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
