name: Build unique-case diagnostic-v2 import-warning TEST IPA (not release)
on:
  push:
    branches: [experiment/case-compatible-assets-build23]
    paths:
      - 'experiments/case-compatible-assets-build23/**'
      - '.github/workflows/validate-case-compatible-assets-build23.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: flashnest-case-compatible-assets-build23
  cancel-in-progress: false
jobs:
  validate:
    runs-on: macos-14
    timeout-minutes: 80
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
      CASE_RECIPE: recipe/experiments/case-compatible-assets-build23
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: recipe
          persist-credentials: false
      - name: Verify reviewed experimental recipe and SDK
        run: |
          set -euo pipefail
          cmp "$CASE_RECIPE/workflow.yml" recipe/.github/workflows/validate-case-compatible-assets-build23.yml
          python3 "$CASE_RECIPE/experiment.py" preflight
          python3 "$CASE_RECIPE/test_ios_runner.py"
          python3 "$CASE_RECIPE/test_native_reference.py"
          test "$(xcodebuild -version | head -1)" = 'Xcode 16.2'
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = '18.2'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: cc6c4bf285a201d9c1a827140662c54606027d10
          path: baseline-recipe
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 9bc000e37695696f2427b25fe08efe4993bf22e5
          path: source-checkout
          persist-credentials: false
      - name: Reconstruct exact diagnostic v2 then apply two server changes
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$CASE_RECIPE/experiment.py" stage --baseline-checkout baseline-recipe --source-checkout source-checkout --output case-stage
      - name: Actual Swift resolver tests on a verified case-sensitive filesystem
        run: |
          set -euo pipefail
          mkdir -p case-stage/evidence
          bash "$CASE_RECIPE/path-tests/run_native_tests.sh" "$PWD/case-stage/app/App/Server/HTTPProtocol.swift" "$PWD/case-stage/evidence/path-result.json"
          python3 "$CASE_RECIPE/experiment.py" verify --output case-stage
      - name: Prepare pinned sandboxed browser test tooling
        id: browser_tools
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/case-browser"
          "$RUNNER_TEMP/case-browser/bin/pip" install playwright==1.51.0
          test -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
      - name: Actual unchanged Ruffle default24 and explicit controls; synthetic clocks separately labelled
        id: fps
        if: ${{ !cancelled() && steps.browser_tools.outcome == 'success' }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/case-browser/bin/python" "$CASE_RECIPE/fps/run_fps.py" --runtime case-stage/app/App/Resources/Web/runtime --inputs baseline-recipe/experiments/longrun-ipa-156-build23/inputs.json --output case-stage/evidence/fps-result.json
          python3 "$CASE_RECIPE/experiment.py" verify --output case-stage
      - name: Preserve focused fixture evidence before the independent iOS lane
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        with:
          name: FlashNest-case-compatible-assets-build23-focused-evidence
          path: |
            case-stage/case-staging.json
            case-stage/evidence/*.json
            case-stage/evidence/*.txt
            case-stage/evidence/*.log
            case-stage/evidence/*.plist
          if-no-files-found: warn
          retention-days: 7
      - name: Verify unchanged candidate against pinned prior 76 plus 2 native execution evidence
        id: ios
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/op233qo123/FlashNest/actions/artifacts/13085011484/zip > case-stage/native-reference.zip
          python3 "$CASE_RECIPE/verify_native_reference.py" --archive case-stage/native-reference.zip --app case-stage/app --stage-receipt case-stage/case-staging.json --baseline-checkout baseline-recipe --output case-stage/evidence/native-reference.json
      - name: Require both timing and native gates with unchanged final source identity
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        run: |
          set -euo pipefail
          test '${{ steps.browser_tools.outcome }}' = 'success'
          test '${{ steps.fps.outcome }}' = 'success'
          test '${{ steps.ios.outcome }}' = 'success'
          python3 "$CASE_RECIPE/experiment.py" verify --output case-stage
      - name: Generate project using verified XcodeGen and locked dependencies
        working-directory: case-stage/app
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 120 https://github.com/yonaskolb/XcodeGen/releases/download/2.42.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          echo 'a760b4bf97460341316a2c00d8c87b2946c6c2729eb57e9a72abb3ef7bc0ef82  '"$RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen-case"
          "$RUNNER_TEMP/xcodegen-case/xcodegen/bin/xcodegen" generate
          mkdir -p FlashNest.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Package.resolved FlashNest.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          xcodebuild -resolvePackageDependencies -project FlashNest.xcodeproj -scheme FlashNest -disableAutomaticPackageResolution
      - name: Build authorized unsigned Release device App
        working-directory: case-stage/app
        run: |
          set -euo pipefail
          xcodebuild -project FlashNest.xcodeproj -scheme FlashNest -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build -disableAutomaticPackageResolution CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package and verify distinct experimental IPA bytes
        run: |
          set -euo pipefail
          mkdir -p case-stage/artifacts
          bash case-stage/app/scripts/package_unsigned.sh case-stage/app/build/Build/Products/Release-iphoneos/FlashNest.app case-stage/artifacts/FlashNest-1.5.6-build23-case-compatible-diagnostic-v2-import-warning-unsigned.ipa
          python3 "$CASE_RECIPE/verify_ipa.py" --ipa case-stage/artifacts/FlashNest-1.5.6-build23-case-compatible-diagnostic-v2-import-warning-unsigned.ipa --app case-stage/app --stage-receipt case-stage/case-staging.json --native-reference case-stage/evidence/native-reference.json --native-archive case-stage/native-reference.zip --baseline-checkout baseline-recipe --path-evidence case-stage/evidence/path-result.json --fps-evidence case-stage/evidence/fps-result.json --output case-stage/artifacts/case-compatible-ipa-provenance.json
      - name: Upload verified unsigned TEST IPA, not a release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FlashNest-1.5.6-build23-case-compatible-diagnostic-v2-import-warning-unsigned
          path: case-stage/artifacts/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: FlashNest-case-compatible-assets-build23-evidence
          path: |
            case-stage/case-staging.json
            case-stage/evidence/*.json
            case-stage/evidence/*.txt
            case-stage/evidence/*.log
            case-stage/evidence/*.plist
            case-stage/evidence/ios/*.json
            case-stage/evidence/ios/*.log
          if-no-files-found: warn
          retention-days: 7
