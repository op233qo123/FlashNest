name: Diagnose AVM2 frame order (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flashnest-frame-order
  cancel-in-progress: false
jobs:
  capture:
    runs-on: macos-14
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify original fixtures and stage opt-in capture harness
        run: |
          set -euo pipefail
          python3 scripts/fetch_runtime.py
          python3 scripts/test_static.py
          python3 scripts/test_localization.py
          python3 scripts/test_licenses.py
          python3 experiments/frame-order/validate_fixtures.py
          test ! -e Tests/FrameOrderRuntimeTests.swift
          test ! -e fixtures/frame-order-experiment
          cp experiments/frame-order/FrameOrderRuntimeTests.swift Tests/
          mkdir fixtures/frame-order-experiment
          cp experiments/frame-order/fixtures/*.swf fixtures/frame-order-experiment/
          curl --fail --location --retry 2 --max-time 120 -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.42.0/xcodegen.zip
          echo "a760b4bf97460341316a2c00d8c87b2946c6c2729eb57e9a72abb3ef7bc0ef82  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen-pinned"
          "$RUNNER_TEMP/xcodegen-pinned/xcodegen/bin/xcodegen" generate
          mkdir -p FlashNest.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Package.resolved FlashNest.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/
          xcodebuild -version
          xcodebuild -resolvePackageDependencies -project FlashNest.xcodeproj -scheme FlashNest -disableAutomaticPackageResolution
      - name: Require installed iOS 18.2 simulator
        id: simulator
        run: |
          set -euo pipefail
          xcrun simctl list runtimes
          device_id=$(xcrun simctl list devices available --json | python3 scripts/select_simulator.py 18.2)
          echo "device_id=$device_id" >> "$GITHUB_OUTPUT"
      - name: Capture both original frame-order variants without asserting Flash compatibility
        timeout-minutes: 10
        run: |
          set -o pipefail
          touch frame-order-start.marker
          xcodebuild test -project FlashNest.xcodeproj -scheme FlashNest -configuration Debug -sdk iphonesimulator -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}' -destination-timeout 120 -derivedDataPath frame-order-build -resultBundlePath FrameOrderResults.xcresult -disableAutomaticPackageResolution -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 120 -only-testing:FlashNestTests/FrameOrderRuntimeTests CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tee frame-order-test.log
      - name: Export measurements including incomplete captures
        if: always()
        run: |
          mkdir -p frame-order-evidence
          python3 scripts/collect_test_webkit_crashes.py frame-order-start.marker frame-order-evidence/webkit-crashes || true
          if [ -d FrameOrderResults.xcresult ]; then
            xcrun xcresulttool get test-results summary --path FrameOrderResults.xcresult > frame-order-evidence/summary.json || true
            xcrun xcresulttool export attachments --path FrameOrderResults.xcresult --output-path frame-order-evidence/attachments || true
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: FlashNest-original-frame-order-evidence
          path: |
            frame-order-test.log
            frame-order-evidence
            experiments/frame-order/fixtures/manifest.json
            experiments/frame-order/structural-validation.json
          if-no-files-found: warn
          retention-days: 7
